[project]
name = "coverlyric"
version = "0.1.0"
description = "Make a lyric video from a song, a square cover and the lyrics, in a local browser page"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/coverlyric/fonts/OFL-*.txt"]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.1",
    "pillow>=11.0",
]

[project.optional-dependencies]
# Automatic timing on the computer; installed by the page the first time it is used.
auto = ["faster-whisper==1.2.1", "av==15.1.0"]
# Letter times and loop sections (coverlyric align, coverlyric sections). torch stays on 2.7: its
# forced_align goes away in 2.9, and 2.7 has no wheels past Python 3.13.
align = [
    "demucs==4.0.1",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "uroman==1.3.1.1",
    "librosa==1.0.1",
]

[project.scripts]
coverlyric = "coverlyric.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
