[project]
name = "coverlyric"
version = "0.1.0"
description = "Make a lyric video from a song, a square cover and the lyrics, in a local browser page"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/coverlyric/fonts/OFL-*.txt"]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.1",
    "pillow>=11.0",
]

[project.scripts]
coverlyric = "coverlyric.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
