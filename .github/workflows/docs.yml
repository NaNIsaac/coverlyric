name: docs
on:
  push:
    branches: [main]
    paths: [README.md, README.en.md, "docs/**", .github/workflows/docs.yml]
  pull_request:
    paths: [README.md, README.en.md, "docs/**", .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The marked blocks in docs/ (the README has none: it installs with setup.exe).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/checkout@v7
        with:
          repository: NaNIsaac/.github
          path: .nanisaac
          sparse-checkout: tools
      - name: README overview synchronization
        run: uv run --no-project python .nanisaac/tools/conventions.py --check-overview .
      - name: Marked documentation examples
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.nanisaac/tools/readme-test.ps1 -Docs
